<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rolê Mapa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sem lista e sem barra de abas. Radar de festas + carteira de ingressos; cada festa é uma "sala" com um relógio lateral que muda o conteúdo (esquenta, pista, depois); dock flutuante contextual. */
:root{
  --bg:#0B1022; --panel:#141B36; --panel-2:#1D2647; --ink:#EEF1FF; --muted:#8E97BD; --line:#2A3460;
  --acc:#FF9F1C; --on-acc:#1A1000; --lilac:#B9A6FF; --ok:#4ADE9B; --warn:#FFC857; --danger:#FF6B6B;
  --paper:#F3F0E8; --paper-ink:#17151C; --scrim:rgba(4,6,16,.66); --glass:rgba(20,27,54,.84); --frame:#262F55;
  --mapbg:#0E1430; --river:#1E4C8F; --park:#163A2C; --road:#2B3662; --sand:#7D6E4C;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDEFF7; --panel:#FFFFFF; --panel-2:#E2E6F3; --ink:#121731; --muted:#5A6185; --line:#D2D7EA;
    --acc:#C25E00; --on-acc:#FFFFFF; --lilac:#5B3FD6; --ok:#11804F; --warn:#8F5E00; --danger:#C73636;
    --paper:#FFFFFF; --paper-ink:#121731; --scrim:rgba(18,23,49,.45); --glass:rgba(255,255,255,.88); --frame:#121731;
    --mapbg:#E5E8F1; --river:#9DC2EE; --park:#C3E4CB; --road:#FFFFFF; --sand:#E9DBAE;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDEFF7; --panel:#FFFFFF; --panel-2:#E2E6F3; --ink:#121731; --muted:#5A6185; --line:#D2D7EA;
  --acc:#C25E00; --on-acc:#FFFFFF; --lilac:#5B3FD6; --ok:#11804F; --warn:#8F5E00; --danger:#C73636;
  --paper:#FFFFFF; --paper-ink:#121731; --scrim:rgba(18,23,49,.45); --glass:rgba(255,255,255,.88); --frame:#121731;
    --mapbg:#E5E8F1; --river:#9DC2EE; --park:#C3E4CB; --road:#FFFFFF; --sand:#E9DBAE;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(50% 45% at 72% 45%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
p{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* palco */
.stage{display:flex;gap:56px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:100vh;padding-block:24px}
.guide{max-width:340px;display:flex;flex-direction:column;gap:16px}
.guide .mark{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.04em}
.guide .mark span{color:var(--acc)}
.guide p{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.step:hover{border-color:var(--acc)}
.step b{font-family:var(--mono);font-size:12px;color:var(--acc);min-width:34px}
.step span{display:flex;flex-direction:column;font-weight:700;font-size:14px}
.step small{color:var(--muted);font-size:12px;font-weight:400}
.reset{align-self:flex-start;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 48px));min-height:620px;border-radius:46px;border:10px solid var(--frame);background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 80px -24px rgba(0,0,0,.6)}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:110px}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:18px 16px;display:flex;flex-direction:column;gap:18px}

/* avatar */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-family:var(--body);flex:none;
  background:linear-gradient(140deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 70% 40%))}
.stack{display:flex}
.stack .av{border:2px solid var(--bg);margin-left:-8px}
.stack .av:first-child{margin-left:0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;background:var(--panel-2);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:default}

/* home: radar */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-size:26px;line-height:1.1}
.mode{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.mode button{display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted)}
.mode button.on{background:var(--ink);color:var(--bg)}
.radar{position:relative;width:100%;max-width:330px;aspect-ratio:1;margin:6px auto 22px}
.radar .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--panel) 90%,transparent),transparent 72%);overflow:hidden}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,color-mix(in srgb,var(--acc) 32%,transparent) 360deg);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px dashed var(--line);border-radius:50%}
.ring span{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);font:10px var(--mono);color:var(--muted);background:var(--bg);padding:0 4px;white-space:nowrap}
.me{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;font:10px var(--mono);color:var(--muted)}
.me i{width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 20%,transparent)}
.blip{position:absolute;transform:translate(-50%,-50%);width:var(--s);height:var(--s);z-index:3}
.blip i{position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 2.4s ease-out infinite}
.blip.sel i{outline:2px solid var(--ink);outline-offset:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 65%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
.blab{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;font-size:11px;font-weight:800;text-align:center;line-height:1.2}
.blab small{display:block;font:10px var(--mono);color:var(--muted);font-weight:400}
.blip .fr{position:absolute;right:-14px;top:-10px;display:flex}
.blip .fr .av{border:2px solid var(--bg);margin-left:-6px}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}

.pv{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.pv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.pv h2{font-size:24px}
.pv-row{display:flex;gap:10px;align-items:center}
.pv-act{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px}
.price{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.erow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.erow .dotc{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.erow .grow{flex:1;min-width:0}
.erow b{display:block}
.erow small{color:var(--muted);font-size:12px}

/* carteira */
.peek{display:flex;flex-direction:column;text-align:left;width:100%;gap:0}
.peek .eyebrow{margin-bottom:8px}
.pk{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 26px;border-radius:18px;background:var(--c);color:#140C14;font-family:var(--display);font-weight:700;font-size:15px;box-shadow:0 -6px 16px -8px rgba(0,0,0,.5)}
.pk+.pk{margin-top:-14px}
.pk small{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.75}
.wallet{position:absolute;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column}
.wallet.enter{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateY(40px)}}
.wtop{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px}
.wtop h2{font-size:24px}
.wlist{flex:1;overflow-y:auto;padding:8px 16px 30px;display:flex;flex-direction:column;gap:14px}
.wc{perspective:900px;height:210px;flex:none}
.wc-in{position:relative;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.wc.flip .wc-in{transform:rotateY(180deg)}
.wc-front,.wc-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.wc-front{background:var(--c);color:#140C14;
  -webkit-mask:radial-gradient(circle 13px at 0 62%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 62%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 13px at 0 62%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 62%,#0000 97%,#000) right/51% 100% no-repeat}
.wc-front h3{font-size:30px;line-height:1;font-weight:800}
.wc-front .meta{display:flex;justify-content:space-between;align-items:flex-end;font:12px var(--mono);border-top:2px dashed rgba(20,12,20,.35);padding-top:10px}
.wc-back{transform:rotateY(180deg);background:var(--panel);border:1px solid var(--line);flex-direction:row;gap:14px;align-items:center}
.wc-back .col{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.qr{width:130px;height:130px;border-radius:12px;background:#fff;padding:7px;flex:none}
.qr svg{display:block;width:100%;height:100%}
.count{font-family:var(--mono);color:var(--acc);font-weight:600}

/* sala */
.rh{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 32%,var(--bg)),var(--bg))}
.rh h1{font-size:30px;line-height:1.02;font-weight:800}
.rh .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.backbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);flex:none}
.room{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:0 14px 0 0}
.rail{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;padding:6px 0 10px}
.rail .now{font:9px var(--mono);letter-spacing:.1em;color:var(--muted);text-align:center;padding-bottom:6px}
.hr{height:38px;font:12px var(--mono);color:var(--muted);border-left:3px solid var(--pc);text-align:center;transition:background .15s}
.hr.esquenta{--pc:var(--lilac)} .hr.pista{--pc:var(--acc)} .hr.depois{--pc:var(--ok)}
.hr:hover{background:color-mix(in srgb,var(--pc) 15%,transparent)}
.hr.on{background:var(--pc);color:var(--bg);font-weight:600;border-radius:0 12px 12px 0}
.rc{display:flex;flex-direction:column;gap:16px;padding-top:6px;min-width:0}
.phead{display:flex;flex-direction:column;gap:4px}
.phead .tag{align-self:flex-start;font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--pc) 22%,transparent);color:var(--pc)}
.phead.esquenta{--pc:var(--lilac)} .phead.pista{--pc:var(--acc)} .phead.depois{--pc:var(--ok)}
.phead h2{font-size:22px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3{font-size:15px}
.hint{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* constelação de quem vai */
.const{position:relative;height:250px;border-radius:20px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--lilac) 14%,transparent),transparent 70%),var(--panel);border:1px solid var(--line);overflow:hidden}
.const::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 30%,transparent) 1px,transparent 1.5px);background-size:22px 22px;opacity:.35}
.cp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.cp.ghost{opacity:.45;pointer-events:none}
.cp.friend .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--lilac)}
.cp .wv{position:absolute;top:-6px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.cmore{position:absolute;right:10px;bottom:10px;font:11px var(--mono);padding:4px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.door{position:relative}
.door .const{filter:blur(6px);opacity:.7}
.door-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:16px}
.door-over .lk{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.door-over h3{font-size:16px}
.door-list{display:flex;flex-direction:column;gap:8px}
.door-list div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.door-list .ic{color:var(--acc)}

/* mural em mosaico */
.wall{columns:2;column-gap:8px}
.tile{break-inside:avoid;margin:0 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile.text{background:linear-gradient(160deg,hsl(var(--th) 75% 60% / .28),var(--panel) 80%)}
.ttext{padding:14px 12px 2px;font-family:var(--display);font-size:13px;line-height:1.35;font-weight:500}
.tcap{padding:8px 10px 0;font-size:12px}
.tauthor{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;font-size:11px;color:var(--muted);min-width:0}
.tauthor b{color:var(--ink);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tauthor .prod{font:9px var(--mono);text-transform:uppercase;color:var(--acc)}
.tlike{position:absolute;top:8px;right:8px;display:flex;gap:3px;align-items:center;font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:var(--glass);color:var(--ink);z-index:4}
.tlike.on{color:var(--acc)}

/* mídia */
.media{position:relative;overflow:hidden;height:var(--mh,180px);background:#111;display:block;width:100%;text-align:left;color:#fff}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .cap{position:absolute;left:8px;bottom:8px;right:50px;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:2}
.media .dur{position:absolute;right:8px;bottom:8px;z-index:2;font:11px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:99px}
.media .playbtn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:2;color:#fff}
.media.once .sc,.media.once img,.media.once video{filter:blur(20px) saturate(1.3);transform:scale(1.25)}
.once-over{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;background:rgba(0,0,0,.25);color:#fff}
.once-over .one{width:44px;height:44px;border-radius:50%;border:2px dashed currentColor;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:800;flex:none}
.once-over b{font-size:13px}
.once-over small{font-size:11px;opacity:.85}
.media.opened{height:auto;background:var(--panel-2);color:var(--muted)}
.media.opened .once-over{position:static;background:none;flex-direction:row;justify-content:flex-start;text-align:left;padding:12px;color:var(--muted)}
.media.opened .one{width:34px;height:34px;font-size:15px}
.sc{position:absolute;inset:0;overflow:hidden}
.sc::before,.sc::after{content:"";position:absolute;inset:0}
.sc-palco{background:linear-gradient(#07040f,#2b0d3d 70%,#5c1040)}
.sc-palco::before{background:conic-gradient(from 160deg at 25% -5%,transparent 0 12deg,rgba(110,200,255,.55) 16deg,transparent 22deg),conic-gradient(from 165deg at 75% -5%,transparent 0 10deg,rgba(255,70,190,.55) 15deg,transparent 21deg),conic-gradient(from 175deg at 50% -5%,transparent 0 6deg,rgba(255,230,120,.45) 9deg,transparent 13deg),radial-gradient(60% 30% at 50% 78%,rgba(255,60,160,.6),transparent)}
.sc-palco::after,.sc-pista::after{top:auto;height:38%;background:radial-gradient(circle 16px at 6% 40%,#050208 97%,transparent),radial-gradient(circle 19px at 18% 30%,#050208 97%,transparent),radial-gradient(circle 15px at 30% 45%,#050208 97%,transparent),radial-gradient(circle 20px at 43% 28%,#050208 97%,transparent),radial-gradient(circle 16px at 56% 42%,#050208 97%,transparent),radial-gradient(circle 18px at 68% 32%,#050208 97%,transparent),radial-gradient(circle 15px at 80% 44%,#050208 97%,transparent),radial-gradient(circle 19px at 93% 30%,#050208 97%,transparent),linear-gradient(transparent 52%,#050208 52%)}
.sc-pista{background:linear-gradient(165deg,#00163a,#2c0a4a 60%,#4a0038)}
.sc-pista::before{background:repeating-linear-gradient(105deg,transparent 0 28px,rgba(0,255,210,.4) 29px 30px,transparent 31px 64px),repeating-linear-gradient(72deg,transparent 0 44px,rgba(255,60,200,.4) 45px 46px,transparent 47px 90px),radial-gradient(50% 35% at 50% 12%,rgba(255,255,255,.4),transparent)}
.sc-bar{background:linear-gradient(170deg,#3a1708,#7a3a12 60%,#2a0f05)}
.sc-bar::before{filter:blur(3px);background:radial-gradient(circle 26px at 15% 25%,rgba(255,200,110,.85) 60%,transparent),radial-gradient(circle 18px at 35% 15%,rgba(255,150,70,.8) 60%,transparent),radial-gradient(circle 34px at 62% 28%,rgba(255,220,150,.6) 60%,transparent),radial-gradient(circle 22px at 85% 18%,rgba(255,120,80,.8) 60%,transparent),radial-gradient(circle 16px at 75% 50%,rgba(255,200,120,.6) 60%,transparent),radial-gradient(circle 20px at 25% 55%,rgba(255,170,90,.5) 60%,transparent)}
.sc-bar::after{top:auto;height:40%;background:radial-gradient(40px 62px at 30% 100%,#160803 97%,transparent),radial-gradient(46px 72px at 70% 100%,#160803 97%,transparent),linear-gradient(transparent,rgba(0,0,0,.55))}
.sc-sunset{background:linear-gradient(#ff9a3c,#ff5e62 45%,#8e2de2 100%)}
.sc-sunset::before{background:radial-gradient(circle 40px at 50% 62%,#ffe08a 96%,transparent),radial-gradient(70% 25% at 50% 62%,rgba(255,230,150,.5),transparent)}
.sc-sunset::after{top:auto;height:34%;background:linear-gradient(#1a0820 0 0) 0 100%/16% 55% no-repeat,linear-gradient(#1a0820 0 0) 17% 100%/10% 85% no-repeat,linear-gradient(#1a0820 0 0) 30% 100%/14% 45% no-repeat,linear-gradient(#1a0820 0 0) 48% 100%/9% 100% no-repeat,linear-gradient(#1a0820 0 0) 62% 100%/15% 60% no-repeat,linear-gradient(#1a0820 0 0) 80% 100%/11% 78% no-repeat,linear-gradient(#1a0820 0 0) 100% 100%/14% 50% no-repeat}
.sc-look{background:linear-gradient(160deg,#ff5fa2,#7a2cff)}
.sc-look::before{background:radial-gradient(circle 32px at 50% 32%,#2a0f2f 96%,transparent),radial-gradient(70px 110px at 50% 100%,#2a0f2f 96%,transparent)}
.sc-churras{background:radial-gradient(80% 60% at 50% 85%,#ff8a1f,#a32a00 55%,#2a0a00)}
.sc-churras::before{top:40%;background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(25,10,0,.85) 20px 24px)}
.sc-churras::after{background:radial-gradient(38px 11px at 28% 58%,#5a1a08 95%,transparent),radial-gradient(38px 11px at 62% 66%,#5a1a08 95%,transparent),radial-gradient(44px 26px at 45% 78%,#7a2a10 95%,transparent),radial-gradient(30px 10px at 75% 52%,#5a1a08 95%,transparent)}
.sc-amanhecer{background:linear-gradient(#2b3a67,#c9748f 60%,#f6c58e)}
.sc-amanhecer::after{top:auto;height:30%;background:linear-gradient(transparent,rgba(10,10,30,.6)),radial-gradient(60px 50px at 30% 100%,#101024 97%,transparent),radial-gradient(70px 60px at 72% 100%,#101024 97%,transparent)}
.sc.anim{animation:hue 5s linear infinite}
.sc.anim::before{animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes hue{to{filter:hue-rotate(70deg)}}

/* pista */
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;flex:none;width:62px;position:relative}
.st .ring2{width:60px;height:60px;border-radius:50%;padding:3px;background:conic-gradient(var(--acc),var(--lilac),var(--acc))}
.st.seen .ring2{background:var(--line)}
.st .ring2 .av{width:100%!important;height:100%!important;border:3px solid var(--bg)}
.st .b1{position:absolute;top:40px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font:10px var(--mono);display:grid;place-items:center;border:2px solid var(--bg)}
.thermo{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.trow{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;font-size:12px}
.trow .bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:99px}
.trow span:last-child{font-family:var(--mono);text-align:right;color:var(--muted)}
.near{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ncard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:12px}
.ncard small{color:var(--muted);font-size:10px;font-family:var(--mono)}
.wavebtn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--acc);color:var(--on-acc)}
.wavebtn.done{background:var(--panel-2);color:var(--muted)}
.deck{position:relative;height:400px}
.swipe{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;touch-action:none;user-select:none;transition:transform .22s ease,opacity .22s ease;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);cursor:grab}
.swipe.under{transform:scale(.95) translateY(12px);opacity:.6;pointer-events:none}
.swipe .face{flex:1;position:relative;display:grid;place-items:center;background:linear-gradient(160deg,hsl(var(--h) 70% 58%),hsl(calc(var(--h) + 50) 65% 32%))}
.swipe .big{font-family:var(--display);font-size:110px;font-weight:800;color:rgba(255,255,255,.9)}
.swipe .vf{position:absolute;top:10px;left:10px;display:flex;gap:4px;align-items:center;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.3);padding:3px 8px;border-radius:99px}
.stamp2{position:absolute;top:18px;font-family:var(--display);font-weight:800;font-size:22px;padding:2px 10px;border:3px solid;border-radius:10px;opacity:0;transition:opacity .1s;background:rgba(0,0,0,.25)}
.stamp2.like{left:14px;color:#7CFFC4;transform:rotate(-12deg)}
.stamp2.pass{right:14px;color:#FFC2D6;transform:rotate(12deg)}
.swipe[data-dir="like"] .stamp2.like,.swipe[data-dir="pass"] .stamp2.pass{opacity:1}
.swipe .info{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.swipe .info h3{font-size:20px}
.swipe .info h3 span{font-weight:500;color:var(--muted)}
.deck-btns{display:flex;justify-content:center;gap:22px}
.round{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.round.like{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

/* depois */
.seen-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seen-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;text-align:center}
.seen-card.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.seen-card .vi{font-size:10px;font-family:var(--mono);color:var(--muted);display:flex;gap:4px;align-items:center}
.seen-card.on .vi{color:var(--ok)}

/* mesa (cupom) */
.receipt{position:relative;background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-size:12.5px;padding:22px 18px;margin:12px 0;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 30px -18px rgba(0,0,0,.5)}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:10px}
.receipt::before{top:-10px;background:radial-gradient(circle at 8px 0,transparent 7px,var(--paper) 7.5px) 0 0/16px 10px repeat-x}
.receipt::after{bottom:-10px;background:radial-gradient(circle at 8px 10px,transparent 7px,var(--paper) 7.5px) 0 0/16px 10px repeat-x}
.receipt .ctr{text-align:center}
.receipt h2{font-family:var(--display);font-size:22px;color:var(--paper-ink);text-align:center;text-transform:uppercase;letter-spacing:-.01em}
.rule{border-top:1px dashed currentColor;opacity:.45;margin:6px 0}
.rl{display:flex;gap:6px;align-items:baseline;min-width:0}
.rl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .dots{flex:1;border-bottom:1px dotted currentColor;opacity:.35;min-width:12px;transform:translateY(-3px)}
.rl .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.rl.tot{font-weight:600;font-size:15px}
.rl .x{opacity:.5;padding:0 2px}
.tag-b{font-size:10px;padding:0 5px;border:1px solid currentColor;border-radius:4px;opacity:.7}
.guest{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 0}
.guest .gn{display:flex;gap:6px;align-items:center;min-width:0}
.guest .gn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drk{font-size:10px;padding:1px 6px;border:1px solid currentColor;border-radius:99px;opacity:.55}
.drk.on{opacity:1;background:var(--paper-ink);color:var(--paper)}
.stamp{font-size:10px;font-weight:600;padding:1px 6px;border:2px solid #15924F;color:#15924F;transform:rotate(-8deg);border-radius:4px;letter-spacing:.06em}
.payme{font-size:10px;font-weight:600;padding:2px 6px;border:2px dashed #B5541A;color:#B5541A;border-radius:4px}
.barcode{height:38px;margin-top:4px;background:repeating-linear-gradient(90deg,var(--paper-ink) 0 2px,transparent 2px 4px,var(--paper-ink) 4px 5px,transparent 5px 8px,var(--paper-ink) 8px 11px,transparent 11px 12px)}
.addrow{display:grid;grid-template-columns:1fr 80px;gap:6px}
.addrow input,.addrow select{width:100%;min-width:0;padding:8px 10px;border-radius:8px;border:1px dashed currentColor;background:transparent;color:var(--paper-ink);font:12px var(--mono);outline:none}
.addrow .full{grid-column:1/-1;display:flex;gap:6px}
.addrow .full select{flex:1}
.addrow button{font:12px var(--mono);padding:8px 10px;border-radius:8px;background:var(--paper-ink);color:var(--paper)}
.mesa-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 10px 10px 14px;border-radius:14px;background:var(--panel);border:1px dashed var(--line);font:12px var(--mono)}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* acenos */
.recv{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 22%,var(--panel)),var(--panel));border:1px solid var(--line)}
.recv .blurstack{display:flex;filter:blur(5px)}
.recv .blurstack .av{margin-left:-10px;border:2px solid var(--panel)}
.list{display:flex;flex-direction:column;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:14px}
.row .grow small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-new{font:10px var(--mono);padding:2px 7px;border-radius:99px;background:var(--acc);color:var(--on-acc)}

/* dock */
.dock{position:absolute;left:12px;right:12px;bottom:14px;z-index:15;display:grid;grid-template-columns:52px 1fr 52px;gap:8px;padding:6px;border-radius:24px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.dock .side{height:48px;border-radius:18px;display:grid;place-items:center;position:relative;color:var(--ink)}
.dock .side:hover{background:var(--panel-2)}
.dock .main{height:48px;border-radius:18px;background:var(--acc);color:var(--on-acc);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.dock .main[disabled]{background:var(--panel-2);color:var(--muted)}
.dock .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:99px;background:var(--acc);color:var(--on-acc);font:10px var(--mono);font-weight:600;display:grid;place-items:center;padding:0 4px}

/* folhas */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 18px 26px;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.sheet h3{font-size:19px}
.lines{display:grid;gap:8px;font-size:14px}
.lines div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:16px}
.payopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%}
.payopt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.payopt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.payopt.on .dot{border:5px solid var(--acc)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.okmark{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#06140D;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.pair{display:flex;align-items:center}
.pair .av{border:3px solid var(--bg)}
.pair .av+.av{margin-left:-18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel-2)}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:160px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;background:var(--panel-2);align-self:flex-start}
.msg.me{background:var(--acc);color:var(--on-acc);align-self:flex-end}
.composer{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0}
textarea.ta{width:100%;min-height:90px;resize:vertical;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);outline:none}
textarea.ta:focus{border-color:var(--acc)}
.draft{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.draft .thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:#000}
.draft .thumb img,.draft .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.toggle.on{border-color:var(--acc);color:var(--acc)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:11px;border:1px solid var(--line);font-size:13px;background:var(--panel)}
.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:800}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(18px)}

.viewer{position:absolute;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;animation:fade .2s}
.viewer .stage-m{position:relative;flex:1;overflow:hidden}
.viewer .stage-m img,.viewer .stage-m video{width:100%;height:100%;object-fit:contain;display:block}
.viewer .prog{position:absolute;top:12px;left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:3px;z-index:3;overflow:hidden}
.viewer .prog i{display:block;height:100%;background:#fff;width:0;animation:prog var(--d) linear forwards}
@keyframes prog{to{width:100%}}
.viewer .vtop{position:absolute;top:24px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:3}
.viewer .vtop .grow{flex:1;min-width:0;font-size:13px}
.vclose{width:38px;height:38px;border-radius:50%;background:rgba(127,127,127,.22);display:grid;place-items:center}
.viewer .vfoot{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 22px;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:3;font-size:14px;display:flex;flex-direction:column;gap:6px}
.oncetag{align-self:flex-start;font:11px var(--mono);font-weight:600;padding:3px 9px;border-radius:99px;background:#FF9F1C;color:#1A1000;text-transform:uppercase}

.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:30;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;animation:up .25s;display:flex;gap:10px;align-items:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 10px;color:var(--muted)}

[hidden]{display:none!important}
/* ---------- Leaflet (estilos essenciais embutidos) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--body);outline:0}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:8px}.leaflet-bottom .leaflet-control{margin-bottom:6px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-control-attribution{background:var(--glass);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:8px}
.leaflet-control-attribution a{color:var(--muted)}

/* ---------- mapa da cidade ---------- */
.map{position:absolute;inset:0;z-index:0;background:var(--mapbg);display:none}
.show-map .map{display:block}
.map-top .map{display:block;bottom:auto;height:300px}
.show-map .leaflet-bottom{bottom:232px}
.map .leaflet-tile-pane{filter:saturate(.75)}
.map.tiles-dark .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.85) contrast(.9) saturate(.55)}
.app{z-index:1}
.app.over-map{pointer-events:none}
.over-map>.dock,.over-map>.sheet,.over-map>.scrim,.over-map>.toast,.over-map>.wallet,.over-map>.viewer{pointer-events:auto}
.over-map .scroll{pointer-events:none;background:transparent}
.mapui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 0 84px}
.mtop{display:flex;flex-direction:column;gap:8px;padding:0 12px;pointer-events:auto}
.cbar{display:flex;gap:8px;align-items:center}
.citybtn{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);text-align:left}
.citybtn>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.citybtn b{font-family:var(--display);font-size:15px}
.citybtn small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinI{color:var(--acc)}
.mbtn{width:44px;height:44px;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mbtn.on{color:var(--acc);border-color:var(--acc)}
.avbtn{flex:none}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:800;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mside{position:absolute;right:12px;top:44%;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.mbottom{pointer-events:auto}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 12px 8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}

function go(screen,extra={}){ S.stack.push({screen:S.screen,ev:S.ev}); Object.assign(S,{screen},extra); S.sheet=null; render(true); }

let toastTimer; function toast(m){ S.toast=m; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{S.toast=null;render();},2600); }
const allPosts=()=>[...Object.values(S.posts).flat(),...Object.values(S.stories).flat(),...Object.values(S.album).flat(),...S.churras.posts];
const findPost=pid=>allPosts().find(p=>p.id===pid);
const kindName=m=>m.kind==='video'?'Vídeo':'Foto';
function qr(seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; const rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296; const N=25; let r='';
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!inF(x,y)&&rnd()>.52) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 25 25" fill="#14101A" shape-rendering="crispEdges" aria-label="QR code">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`; }
const qrBucket=()=>Math.floor(Date.now()/30000), qrLeft=()=>30-(Math.floor(Date.now()/1000)%30);
function calc(){ const c=S.churras; const food=c.items.filter(i=>i.c!=='bebida').reduce((a,i)=>a+i.v,0), drink=c.items.filter(i=>i.c==='bebida').reduce((a,i)=>a+i.v,0);
  const n=c.guests.length, d=c.guests.filter(g=>g.drinks).length, fs=n?food/n:0, ds=d?drink/d:0; const share=g=>Math.round((fs+(g.drinks?ds:0))*100)/100;
  return {food,drink,fs,ds,share,total:food+drink,got:c.guests.filter(g=>g.paid).reduce((a,g)=>a+share(g),0),n,d}; }
const received=()=>EVENTS.filter(e=>S.owned[e.id]).flatMap(e=>PEOPLE[e.id].map((p,i)=>({p,ev:e.id,i}))).filter(x=>x.p.liked&&!S.waved[x.ev+'|'+x.i]);

function render(resetScroll){
  const sc=document.getElementById('scroll'), top=sc?sc.scrollTop:0;
  const keep={}; $app.querySelectorAll('input[id]:not([type=file]),select[id],textarea[id]').forEach(el=>keep[el.id]=el.value);
  const screens={home,room,mesa,acenos,prod,prodNew,checkin};
  $app.innerHTML=`<div class="scroll" id="scroll">${screens[S.screen]()}</div>${dockHTML()}${walletHTML()}${sheetHTML()}${S.toast?`<div class="toast" role="status">${ic('check',18,2.4)}${esc(S.toast)}</div>`:''}${viewerHTML()}`;
  for(const [id,v] of Object.entries(keep)){ const el=document.getElementById(id); if(el) el.value=v; }
  const ns=document.getElementById('scroll'); if(ns&&!resetScroll) ns.scrollTop=top;
  const m=$app.querySelector('.msgs'); if(m) m.scrollIntoView({block:'end'});
  const vv=$app.querySelector('.viewer video'); if(vv) vv.addEventListener('ended',()=>A.closeViewer());
  syncMap(); bindDeck();
}

function wave(id,saw,quiet){
  if(S.waved[id]) return; const [ev,i]=id.split('|'), p=PEOPLE[ev][+i];
  if(S.visibility!=='visivel' && !saw){ toast('Ative "Visível" no perfil para usar o match'); return; }
  if(quiet && !p.liked){ S.waved[id]=true; render(); return; }
  S.waved[id]=true;
  if(p.liked){ S.matches.unshift({n:p.n,a:p.a,h:p.h,ev,msgs:[],unread:0}); S.sheet={type:'match',p,ev,saw}; render(); }
  else { S.sheet=null; toast(saw?`Marcado. Se ${p.n} marcar você também, vocês dão match.`:`Curtida enviada. Se ${p.n} curtir você também, dá match.`); }
}

const TEMPLATES={0:[{n:'Carnes',v:300,c:'comida'},{n:'Carvão e gelo',v:70,c:'comida'},{n:'Cerveja',v:200,c:'bebida'}],1:[{n:'Bolo e docinhos',v:160,c:'comida'},{n:'Salgados (200 un.)',v:180,c:'comida'},{n:'Espumante e cerveja',v:150,c:'bebida'}],2:[{n:'Petiscos',v:120,c:'comida'},{n:'Gelo',v:30,c:'comida'},{n:'Bebidas',v:300,c:'bebida'}]};
const NEWBIES=[['Rafa',200],['Bia',340],['Caio',30],['Nanda',300],['Léo',150],['Carol',10],['Diego',220],['Paty',260]];
const REPLIES=['Haha, boa! Tô perto do bar.','Fechou! Me manda onde você tá.','Tô de camisa verde, fácil de achar.','Bora! Tô com umas amigas também.'];

const A={
  home:()=>{ S.stack=[]; S.screen='home'; S.sheet=null; S.wallet=false; render(true); },
  back:()=>back(),
  mode:id=>{S.mode=id;render();},
  sel:id=>{S.sel=id;render();},
  room:id=>{ S.wallet=false; go('room',{ev:id}); },
  mesa:()=>{ S.wallet=false; go('mesa'); },
  acenos:()=>{ if(S.screen!=='acenos') go('acenos'); },
  profile:()=>{S.sheet={type:'profile'};render();},
  wallet:()=>{S.wallet=true;S.walletEnter=true;render();},
  closeWallet:()=>{S.wallet=false;render();},
  flip:id=>{ S.flip[id]=!S.flip[id]; const el=$app.querySelector(`.wc[data-card="${id}"]`); if(el) el.classList.toggle('flip',S.flip[id]); else render(); },
  hour:id=>{S.hour=+id;render(true);},
  buy:()=>{S.sheet={type:'buy',step:'resumo',pay:'pix'};render();},
  payopt:id=>{S.sheet.pay=id;render();},
  buyNext:()=>{ if(S.sheet.pay==='pix'){S.sheet.step='pix';render();} else A.pixOk(); },
  pixOk:()=>{ S.owned[S.ev]=true; S.sheet={type:'buy',step:'ok'}; render(); },
  enter:()=>{ S.sheet=null; S.hour=1; render(true); },
  closeSheet:()=>{S.sheet=null;render();},
  person:id=>{S.sheet={type:'person',id};render();},
  wave:id=>wave(id,false),
  saw:id=>wave(id,true),
  like:id=>{S.myLikes[id]=!S.myLikes[id];render();},
  view:id=>{ const p=findPost(id); if(!p||!p.media) return; const m=p.media;
    if(m.once){ if(S.opened[id]) return; S.opened[id]=true; } S.seenStory[id]=true;
    S.viewer={pid:id}; render(); clearTimeout(viewTimer); const isVid=m.kind==='video';
    if(!(m.url&&isVid)) viewTimer=setTimeout(()=>{ if(S.viewer&&S.viewer.pid===id) A.closeViewer(); },(isVid?(m.dur||10):6)*1000); },
  closeViewer:()=>{ clearTimeout(viewTimer); S.viewer=null; render(); },
  compose:id=>{ S.sheet={type:'compose',scope:id}; S.draft=null; render(); },
  onceToggle:()=>{ if(S.draft){S.draft.once=!S.draft.once;render();} },
  dropDraft:()=>{ S.draft=null; render(); },
  publish:()=>{ const t=document.getElementById('ctext'), v=t.value.trim(), d=S.draft, sc=S.sheet.scope; if(!v&&!d){ t.focus(); return; }
    const list=sc==='mesa'?S.churras.posts:S.posts[sc]; list.unshift({who:'Você',h:280,t:'agora',txt:v,likes:0,media:d?{kind:d.kind,url:d.url,once:d.once,mh:220}:undefined});
    t.value=''; S.draft=null; S.sheet=null; if(sc!=='mesa'&&phaseOf(S.hour)!=='esquenta') S.hour=1;
    toast(d&&d.once?'Publicado. Cada pessoa pode abrir uma vez.':'Publicado no mural'); },
  chat:id=>{ const i=+id; if(S.matches[i]) S.matches[i].unread=0; S.sheet={type:'chat',i}; render(); },
  vis:id=>{S.visibility=id;render();},
  sw:id=>{S[id]=!S[id];render();},
  delItem:id=>{S.churras.items.splice(+id,1);render();},
  drinks:id=>{const g=S.churras.guests[+id]; g.drinks=!g.drinks; render();},
  pay:id=>{const g=S.churras.guests[+id]; g.paid=true; toast(`Pix de ${g.n} recebido: ${brl(calc().share(g))}`);},
  remind:()=>{const n=S.churras.guests.filter(g=>!g.paid).length; if(n) toast(`Lembrete com Pix enviado para ${n} ${n===1?'pessoa':'pessoas'}`);},
  copy:()=>{ const t='https://'+document.getElementById('invlink').textContent;

function salesChart(d){
  const max=Math.max(...d); if(!max) return `<p class="small muted">Nenhuma venda ainda. Compartilhe o link do evento para começar.</p>`;
  const W=320,H=132,pl=28,pb=18,pt=18,bw=(W-pl)/d.length,top=Math.ceil(max/25)*25, y=v=>pt+(H-pt-pb)*(1-v/top);
  const start=new Date(2026,10,22), lab=i=>{ const t=new Date(start); t.setDate(start.getDate()+i); return t.getDate()+'/'+(t.getMonth()+1); };
  const grid=[0,top/2,top].map(v=>`<line class="grid" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('');
  const bars=d.map((v,i)=>`<rect class="sbar" x="${(pl+i*bw+2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${Math.max(H-pb-y(v),1).toFixed(1)}" rx="3" data-tip="${lab(i)} · ${v} ingressos"/>`).join('');
  const xl=[0,7,13].map(i=>`<text class="axis" x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${lab(i)}</text>`).join('');
  const L_=d.length-1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingressos vendidos por dia nos últimos 14 dias. Pico de ${max} em ${lab(d.indexOf(max))}.">${grid}${bars}${xl}<text class="lbl" x="${(pl+L_*bw-2).toFixed(1)}" y="${(y(d[L_])+10).toFixed(1)}" text-anchor="end">${d[L_]} hoje</text></svg><span class="ctip" id="ctip" hidden></span></div>`;
}

function bindDeck(){
  const c=$app.querySelector('.swipe:not(.under)'); if(!c) return;
  let x0=null, dx=0;
  c.addEventListener('pointerdown',ev=>{ x0=ev.clientX; dx=0; c.setPointerCapture(ev.pointerId); c.style.transition='none'; });
  c.addEventListener('pointermove',ev=>{ if(x0===null) return; dx=ev.clientX-x0; c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; c.dataset.dir=dx>40?'like':dx<-40?'pass':''; });
  const end=()=>{ if(x0===null) return; x0=null; c.style.transition=''; if(Math.abs(dx)>90) decideCard(dx>0); else { c.style.transform=''; c.dataset.dir=''; } dx=0; };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
}
function decideCard(like){
  const c=$app.querySelector('.swipe:not(.under)'); if(!c) return; const id=c.dataset.card;
  c.dataset.dir=like?'like':'pass'; c.style.transform=`translateX(${like?420:-420}px) rotate(${like?22:-22}deg)`; c.style.opacity='0';
  setTimeout(()=>{ if(like) wave(id,false,true); else { S.passed[id]=true; render(); } },230);
}

    if(!navigator.geolocation){ toast('Este navegador não tem GPS. Escolha a cidade na lista.'); return; }
    S.locating=true; render(); const req=++geoReq;
    const fail=()=>{ if(req!==geoReq||!S.locating) return; clearTimeout(geoTimer); S.locating=false; geoReq++; render(); toast('Não deu pra usar o GPS aqui. Escolha a cidade na lista.'); };
    geoTimer=setTimeout(fail,6000);
    try{ navigator.geolocation.getCurrentPosition(p=>{
      if(req!==geoReq) return; clearTimeout(geoTimer);
      S.locating=false; const pos=[p.coords.latitude,p.coords.longitude]; let best=CITIES[0],bd=1e9;
      CITIES.forEach(c=>{ const d=distLL(pos,[c.lat,c.lng]); if(d<bd){ bd=d; best=c; } });
      setCity(best.id, bd<80?pos:null);
      toast(bd<80?`Você está em ${best.name}`:`A cidade com Rolê mais perto é ${best.name}, a ${Math.round(bd)} km`);
    },fail,{timeout:5000,maximumAge:600000}); }catch(err){ fail(); }
  },
  prod:()=>{ S.sheet=null; S.wallet=false; S.stack=[]; if(!S.prod.events.includes(S.prodEv)) S.prodEv=S.prod.events[0]; S.screen='prod'; render(true); },
  exitProd:()=>{ S.stack=[]; S.screen='home'; S.scanRes=null; render(true); },
  prodGo:id=>{ S.screen=id; S.scanRes=null; render(true); },
  prodEv:id=>{ S.prodEv=id; render(); },
  prodNew:()=>{ S.screen='prodNew'; S.sheet=null; render(true); const c=cityById(S.city); if(map){ map.setView(c.me||[c.lat,c.lng],14); map.invalidateSize(); } },
  prodBack:()=>{ S.screen='prod'; render(true); },
  prodSubmit:()=>{ const f=document.getElementById('prodNewForm'); if(f){ if(f.reportValidity()) submitProdNew(); } },
  pnAge:id=>{ S.pnAge=id; render(); },
  pnColor:id=>{ S.pnColor=id; render(); },
  pnRule:id=>{ S.pnRules[id]=!S.pnRules[id]; render(); },
  prodRule:id=>{ const r=S.prod.rules[S.prodEv]; r[id]=!r[id]; render(); },
  prodLote:()=>{ const st=S.prod.stats[S.prodEv], last=st.lotes[st.lotes.length-1]; st.lotes.push({n:'Lote extra',p:last.p+20,sold:0,cap:50}); toast('Lote extra com 50 ingressos aberto'); },
  prodMsg:()=>{ S.sheet={type:'prodMsg'}; render(); },
  sendProdMsg:()=>{ const v=document.getElementById('pm-t').value.trim(); if(!v) return; const ev=evById(S.prodEv);
    (S.posts[ev.id]=S.posts[ev.id]||[]).unshift({who:S.prod.name,h:300,prod:true,t:'agora',txt:v,likes:0}); document.getElementById('pm-t').value=''; S.sheet=null;
    toast(`Aviso enviado para ${soldOf(ev.id)} compradores e fixado no mural`); },
  openRoomProd:()=>{ S.owned[S.prodEv]=true; S.stack=[{screen:'prod',ev:null}]; S.ev=S.prodEv; S.hour=1; S.screen='room'; render(true); },
  scan:()=>{
    const st=S.prod.stats[S.prodEv], pool=[...PEOPLE.neon.map(p=>[p.n,p.h]),...GHOSTS]; S.scanN++; const k=S.scanN;
    if(k%7===0) S.scanRes={ok:false,t:'QR expirado',d:'Parece print. Peça pra abrir o ingresso no app.'};
    else if(k%5===0&&st.checkins.length) S.scanRes={ok:false,t:'Já utilizado',d:`${st.checkins[0].n} entrou às ${st.checkins[0].t}`};
    else { const [nm,h]=pool[k%pool.length], m=2+st.checkins.length*2; const t=`${m>59?'00':'23'}:${String(m%60).padStart(2,'0')}`, lote=st.lotes[st.checkins.length%Math.min(2,st.lotes.length)].n;
      st.checkins.unshift({n:nm,h,t,lote}); S.scanRes={ok:true,t:'Pode entrar',d:`${nm} · ${lote}`}; }
    render(); clearTimeout(scanT); scanT=setTimeout(()=>{ S.scanRes=null; if(S.screen==='checkin') render(); },1800);
  },
  guide:id=>{
    S.sheet=null; S.wallet=false; S.viewer=null; S.stack=[]; S.scanRes=null;
    if(id==='city'){ S.screen='home'; S.mode='mapa'; S.sheet={type:'city'}; render(true); return; }
    if(id==='map'){ S.screen='home'; S.mode='mapa'; render(true); return; }
    if(id==='room'){ S.owned.neon=true; S.ev='neon'; S.hour=1; S.screen='room'; render(true); return; }
    if(id==='prod'){ S.prodEv='neon'; S.screen='prod'; render(true); return; }
    if(id==='prodNew'){ A.prodNew(); return; }
    if(id==='checkin'){ S.prodEv='neon'; S.screen='checkin'; render(true); return; }
    if(id==='mesa'){ S.screen='mesa'; render(true); }
  },
  reset:()=>{ for(let i=EVENTS.length-1;i>=0;i--) if(EVENTS[i].mine) EVENTS.splice(i,1); S=freshState(); carScroll=0; mkKey=''; geoReq++; clearTimeout(geoTimer); render(true); const c=cityById('sp'); if(map) map.setView([c.lat,c.lng],c.z); }
});
document.addEventListener('pointermove',ev=>{
  const tip=document.getElementById('ctip'); if(!tip) return; const b=ev.target.closest&&ev.target.closest('.sbar');
  if(!b){ tip.hidden=true; return; } const box=tip.parentElement.getBoundingClientRect(), r=b.getBoundingClientRect();
  tip.textContent=b.dataset.tip; tip.style.left=(r.left+r.width/2-box.left)+'px'; tip.style.top=(r.top-box.top)+'px'; tip.hidden=false;
});

if(!window.L) S.mode='lista';
S.sheet={type:'city',first:true};
render(true);
</script>
